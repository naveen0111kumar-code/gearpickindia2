apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-marketing-backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-marketing-backend } }
  template:
    metadata: { labels: { app: ai-marketing-backend } }
    spec:
      containers:
        - name: backend
          image: ai-marketing-backend:latest
          ports: [{containerPort: 4000}]
