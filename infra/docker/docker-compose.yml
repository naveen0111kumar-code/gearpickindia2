services:
  backend:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.backend }
    env_file: ../../.env
    ports: ["4000:4000"]
  frontend:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile.frontend }
    ports: ["5173:5173"]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: aimarketing
    ports: ["5432:5432"]
