<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GearPick Admin — Mission Control</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080a0c;--bg2:#0e1114;--bg3:#141820;
  --lime:#b8ff00;--lime-dim:rgba(184,255,0,0.08);--lime-glow:0 0 20px rgba(184,255,0,0.25);
  --red:#ff4444;--red-dim:rgba(255,68,68,0.1);
  --blue:#00cfff;--blue-dim:rgba(0,207,255,0.1);
  --text:#eef0ee;--muted:#4a5560;--border:rgba(184,255,0,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-size:14px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:0}

/* TOP BAR */
.topbar{
  background:rgba(8,10,12,0.96);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:0 28px;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.tlogo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--text)}
.tlogo span{color:var(--lime)}
.tstatus{font-family:'Space Mono',monospace;font-size:10px;color:var(--lime);letter-spacing:2px;display:flex;align-items:center;gap:6px}
.tstatus::before{content:'';width:6px;height:6px;background:var(--lime);border-radius:50%;box-shadow:var(--lime-glow);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* LAYOUT */
.layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 58px);position:relative;z-index:1}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

/* SIDEBAR — ADD FORM */
.sidebar{
  border-right:1px solid var(--border);
  padding:24px;background:var(--bg2);
  position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;
}
@media(max-width:900px){.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}}
.sid-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;margin-bottom:20px;color:var(--lime)}
.field{margin-bottom:14px}
.field label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase}
.field input,.field select{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);font-family:'Outfit',sans-serif;font-size:13px;
  padding:9px 12px;outline:none;
  transition:border-color .2s;
}
.field input:focus,.field select:focus{border-color:var(--lime)}
.field select option{background:var(--bg3)}
.field input::placeholder{color:var(--muted)}
.preview-img{
  width:100%;aspect-ratio:1;background:var(--bg3);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  margin-top:8px;overflow:hidden;
}
.preview-img img{max-width:80%;max-height:80%;object-fit:contain}
.preview-img .ph{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.badge-opt{
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;
  padding:4px 10px;border:1px solid var(--border);cursor:pointer;
  background:transparent;color:var(--muted);transition:all .15s;
}
.badge-opt.sel,.badge-opt:hover{border-color:var(--lime);color:var(--lime);background:var(--lime-dim)}
.badge-opt.sel-none.sel{color:#060809;background:var(--lime)}
.btn-add{
  width:100%;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;
  background:var(--lime);color:#060809;border:none;padding:13px;
  cursor:pointer;margin-top:6px;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 100%,8px 100%);
  transition:all .2s;
}
.btn-add:hover{background:#d4ff33;box-shadow:var(--lime-glow)}

/* MAIN CONTENT */
.main{padding:24px;overflow-y:auto}

/* STATS ROW */
.stats{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.stat{
  background:var(--bg2);border:1px solid var(--border);
  padding:14px 20px;flex:1;min-width:100px;
}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--lime);letter-spacing:2px}
.stat-l{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:2px}

/* TOOLBAR */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.ftab{
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;
  padding:7px 16px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;
  transition:all .15s;
}
.ftab.on{background:var(--lime);color:#060809;border-color:var(--lime);font-weight:700}
.ftab:hover:not(.on){border-color:var(--lime);color:var(--lime)}
.btn-dl{
  font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;
  background:transparent;border:1px solid var(--lime);color:var(--lime);
  padding:8px 20px;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 6px) 0,100% 100%,6px 100%);
  transition:all .2s;white-space:nowrap;
}
.btn-dl:hover{background:var(--lime);color:#060809;box-shadow:var(--lime-glow)}

/* PRODUCT TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
thead tr{border-bottom:1px solid var(--lime);background:var(--bg2)}
th{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--lime);padding:10px 12px;text-align:left;text-transform:uppercase;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
tbody tr:hover{background:var(--bg3)}
tbody tr.editing{background:rgba(184,255,0,0.05);border-color:var(--lime)}
td{padding:10px 12px;vertical-align:middle}
.td-img{width:44px;height:44px;background:var(--bg3);object-fit:contain;border:1px solid var(--border)}
.td-img-wrap{width:44px;height:44px;background:var(--bg3);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);overflow:hidden}
.td-title{font-size:13px;font-weight:500;max-width:240px;line-height:1.4}
.td-price{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--lime);white-space:nowrap}
.cat-chip{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:2px 8px;border:1px solid var(--border);color:var(--muted)}
.badge-chip{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:2px 8px;background:var(--lime);color:#060809;font-weight:700}
.acts{display:flex;gap:6px}
.btn-edit{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:var(--blue-dim);border:1px solid var(--blue);color:var(--blue);cursor:pointer;transition:all .15s}
.btn-edit:hover{background:var(--blue);color:#060809}
.btn-del{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:5px 10px;background:var(--red-dim);border:1px solid var(--red);color:var(--red);cursor:pointer;transition:all .15s}
.btn-del:hover{background:var(--red);color:#fff}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-bg.hide{display:none}
.modal{background:var(--bg2);border:1px solid var(--border);padding:28px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;position:relative}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--lime);margin-bottom:20px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;transition:color .15s}
.modal-close:hover{color:var(--red)}
.btn-save{
  width:100%;font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:3px;
  background:var(--blue);color:#060809;border:none;padding:12px;
  cursor:pointer;margin-top:10px;transition:all .2s;
}
.btn-save:hover{background:#33d6ff}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:1px}

/* TOAST */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:300;
  background:var(--lime);color:#060809;
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;
  padding:10px 20px;
  transform:translateY(60px);opacity:0;
  transition:all .3s;
}
.toast.show{transform:translateY(0);opacity:1}
</style>
</head>

    <button class="btn-add" onclick="addProduct()">ADD TO ARSENAL</button>

      <div class="stat"><div class="stat-n" id="s-headphone">0</div><div class="stat-l">HEADPHONES</div></div>
    </div>

    <div class="toolbar">
      <div class="filter-tabs">
        <button class="ftab on" onclick="filterTbl('all',this)">ALL</button>
        <button class="ftab" onclick="filterTbl('mouse',this)">MICE</button>
        <button class="ftab" onclick="filterTbl('keyboard',this)">KEYBOARDS</button>
        <button class="ftab" onclick="filterTbl('headphone',this)">HEADPHONES</button>
      </div>
      <button class="btn-dl" onclick="downloadIndex()">⬇ DOWNLOAD index.html</button>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>IMG</th>
            <th>PRODUCT</th>
            <th>CAT</th>
            <th>PRICE</th>
            <th>BADGE</th>
            <th>ACTIONS</th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
    <div class="empty hide" id="empty-msg">// NO PRODUCTS FOUND //</div>
  </main>
</div>

<!-- EDIT MODAL -->
<div class="modal-bg hide" id="edit-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>

    <div class="field">

        <option value="headphone">Headphone</option>

    <div class="field">

    <div class="field">

        <button class="badge-opt" onclick="setEditBadge('ELITE',this)">ELITE</button>
        <button class="badge-opt" onclick="setEditBadge('PRO',this)">PRO</button>
      </div>
    </div>
    <button class="btn-save" onclick="saveEdit()">SAVE CHANGES</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

// ── ADD PRODUCT ──
function addProduct(){
  const title = document.getElementById('f-title').value.trim();

  const cat   = document.getElementById('f-cat').value;
  const link  = document.getElementById('f-link').value.trim();
  const img   = document.getElementById('f-img').value.trim();
  if(!title||!price||!link){ toast('FILL ALL REQUIRED FIELDS'); return; }
  products.push({title,price,img,link,cat,badge:curAddBadge||null});
  save(); render();
  // reset form
  ['f-title','f-price','f-link','f-img'].forEach(id=>document.getElementById(id).value='');

  document.querySelectorAll('.badge-row .badge-opt').forEach(b=>b.classList.remove('sel'));

}

  if(!confirm('Delete "'+products[idx].title+'"?')) return;
  products.splice(idx,1);
  save(); render();
  toast('PRODUCT REMOVED');
}

  document.getElementById('e-cat').value = p.cat;
  document.getElementById('e-link').value = p.link;

}

}

function previewImg(url, containerId){

  box.innerHTML=`<img src="${url}" style="max-width:80%;max-height:80%;object-fit:contain" onerror="this.parentNode.innerHTML='<span class=\\'ph\\'>IMAGE NOT FOUND</span>'"/>`;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;

}
