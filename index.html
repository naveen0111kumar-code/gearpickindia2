<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GearPick India</title>
    <meta name="description" content="India's fastest way to pick the right gadget. Handpicked Amazon deals on headphones, keyboards, and mice with verified ratings and direct checkout." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script>
  // Neeche apni Google Sheet ki CSV link paste karo
  const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9LFlUmyOee9fc02skxWglRj4Y926bI2mcr0Fs5yF9Kj-191gVS1iM85S6Y-_tQ8wGPSkA6-KKS22F/pubhtml';

  fetch(sheetUrl)
    .then(response => response.text())
    .then(data => {
      // CSV data ko lines mein todna
      const rows = data.split('\n');
      
      // HTML mein data dikhane ke liye ek div chahiye
      const container = document.getElementById('sheet-data');
      
      rows.forEach(row => {
        const columns = row.split(','); // Comma ke hisaab se data alag karna
        const div = document.createElement('div');
        div.textContent = columns.join(' | '); // Har row ko | se separate karke dikhana
        container.appendChild(div);
      });
    })
    .catch(error => console.error('Error fetching data:', error));
</script>

<!-- Data yahan dikhega -->
<div id="sheet-data"></div></body>
</html>
