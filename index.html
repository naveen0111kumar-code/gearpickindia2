<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>GearPick India — Best Tech Deals 2026</title>

<style>
/* ===== KEEP YOUR FULL CSS SAME (UNCHANGED) ===== */
/* (Tumhara CSS same hai, koi change nahi kiya) */
body { font-family: Arial; background:#050505; color:#fff; margin:0; }
.products-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; padding:20px; }
.product-card { background:#111; padding:15px; border-radius:12px; }
.product-image img { width:100%; height:200px; object-fit:contain; background:#fff; }
.buy-btn { display:block; text-align:center; background:#00d9ff; padding:10px; margin-top:10px; color:#000; text-decoration:none; font-weight:bold; border-radius:8px; }
.skeleton { height:300px; background:#222; border-radius:10px; }
.no-products { padding:40px; text-align:center; color:#999; }
</style>
</head>

<body>

<h2 style="text-align:center; padding:20px;">🛒 Top Products</h2>

<div class="products-grid" id="products">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</div>

<script>

const sheetURL = "https://opensheet.elk.sh/11MjkRDuO7fDy4gWDQcRqWJZlEX3BJa2kXhwXoa97rCs/sheet1";

/* ===== LOAD PRODUCTS FIXED ===== */
async function loadProducts() {
  try {
    const res = await fetch(sheetURL);
    const products = await res.json();

    const container = document.getElementById("products");

    if (!products || products.length === 0) {
      container.innerHTML = `<div class="no-products">No products found</div>`;
      return;
    }

    let html = "";

    products.forEach((p, i) => {

      const title = (p.title || "No Title").toString();
      const desc = (p.description || "").toString();
      const image = p.image || "https://via.placeholder.com/300";
      const link = p.affiliate_link || "#";

      /* ===== FIX PRICE ISSUE ===== */
      const price = Number(p.price);
      const safePrice = isNaN(price) ? 0 : price;

      const original = Math.round(safePrice * 1.3);
      const save = original - safePrice;

      /* ===== CATEGORY FIX ===== */
      let cat = "gadgets";
      const t = title.toLowerCase();

      if (t.includes("headphone") || t.includes("ear")) cat = "headphone";
      else if (t.includes("keyboard")) cat = "keyboard";
      else if (t.includes("mouse") || t.includes("cable")) cat = "accessories";

      html += `
      <div class="product-card" data-category="${cat}">
        <div class="product-image">
          <img src="${image}" alt="${title}" loading="lazy">
        </div>

        <h3>${title}</h3>
        <p>${desc}</p>

        <div style="margin:10px 0;">
          <b>₹${safePrice}</b>
          <del style="color:#777;">₹${original}</del>
          <span style="color:#0f0;"> Save ₹${save}</span>
        </div>

        <a class="buy-btn" href="${link}" target="_blank">Buy on Amazon</a>
      </div>
      `;
    });

    container.innerHTML = html;

  } catch (err) {
    console.error(err);
    document.getElementById("products").innerHTML =
      `<div class="no-products">⚠️ Failed to load products (Sheet error)</div>`;
  }
}

/* ===== FIX: RUN AFTER PAGE LOAD ===== */
window.addEventListener("DOMContentLoaded", loadProducts);

</script>

</body>
</html>
