<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="GearPick India - Best Tech Gadgets, Headphones, Keyboards & Mice"/>
    <title>GearPick India • Premium Tech Picks 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00f5ff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
        }
        header { padding: 20px 8%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 28px; font-weight: 800; background: linear-gradient(90deg, #00f5ff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .hero { text-align: center; padding: 80px 8% 60px; }
        .hero h1 { font-size: 48px; line-height: 1.1; margin-bottom: 12px; }
        .hero p { font-size: 22px; color: #ccc; }

        .controls { padding: 20px 8%; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .search-bar { padding: 14px 20px; width: 100%; max-width: 420px; background: #111; border: 1px solid #333; border-radius: 50px; color: white; font-size: 16px; }
        .filter-btn { padding: 10px 22px; background: #111; border: 1px solid #333; border-radius: 50px; cursor: pointer; transition: 0.3s; }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: black; font-weight: 600; }

        .products { padding: 20px 8% 60px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 28px; }
        .card { background: #111; border-radius: 20px; overflow: hidden; transition: all 0.4s; }
        .card:hover { transform: translateY(-15px); box-shadow: 0 25px 50px rgba(0, 245, 255, 0.2); }
        .card img { width: 100%; height: 260px; object-fit: contain; background: #1a1a1a; padding: 20px; }
        .card-content { padding: 20px; }
        .price { font-size: 26px; font-weight: 700; color: var(--primary); }
        .btn { margin-top: 16px; width: 100%; padding: 16px; background: linear-gradient(90deg, #00f5ff, #ff00ff); color: #000; font-weight: 700; border: none; border-radius: 12px; }

        .blog { padding: 60px 8%; background: rgba(0,0,0,0.4); }
        .blog h2 { text-align:center; margin-bottom:40px; font-size:36px; }
        .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 25px; }
        .blog-card { background: #111; padding: 25px; border-radius: 20px; transition: 0.3s; }
        .blog-card:hover { transform: translateY(-8px); }
    </style>
</head>
<body>

<header>
    <div class="logo">GearPick India</div>
</header>

<section class="hero">
    <h1>Our Top Picks in <span>Tech & Gadgets</span></h1>
    <p>Handpicked • Tested • Honest Reviews • Best Amazon Deals</p>
</section>

<div class="controls">
    <input type="text" id="searchBar" class="search-bar" placeholder="Search headphones, keyboard, mouse...">
    <button class="filter-btn active" onclick="filterCategory('All')">All</button>
    <button class="filter-btn" onclick="filterCategory('Headphones')">Headphones</button>
    <button class="filter-btn" onclick="filterCategory('Keyboard')">Keyboard</button>
    <button class="filter-btn" onclick="filterCategory('Mouse')">Mouse</button>
</div>

<section class="products" id="products"></section>

<section class="blog">
    <h2>Latest Reviews & Buying Guides</h2>
    <div class="blog-grid" id="blog-grid"></div>
</section>

<script>
const SHEET_URL = "https://opensheet.elk.sh/11MjkRDuO7fDy4gWDQcRqWJZlEX3BJa2kXhwXoa97rCs/Sheet1";
let PRODUCTS = [];

async function loadProducts() {
    try {
        const res = await fetch(SHEET_URL);
        const data = await res.json();

        PRODUCTS = data.map(p => ({
            title: (p.title || "").trim(),
            description: (p.description || "").trim(),
            image: (p.image || "").trim(),
            price: parseFloat(String(p.price || "0").replace(/[^0-9.]/g, "")) || 0,
            affiliate_link: p.affiliate_link || "#",
            category: (p.category || "Other").trim()
        })).filter(p => p.title.length > 5);

        renderProducts(PRODUCTS);
    } catch(e) {
        document.getElementById("products").innerHTML = `<div style="text-align:center; color:red;">Products load nahi ho rahe. Refresh karo.</div>`;
    }
}

function renderProducts(list) {
    let html = "";
    list.forEach(p => {
        const original = Math.round(p.price * 1.35);
        html += `
            <div class="card">
                <img src="${p.image}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/400x300/1a1a1a/666?text=No+Image'">
                <div class="card-content">
                    <small style="color:#00f5ff;">${p.category}</small>
                    <h3>${p.title}</h3>
                    <p style="color:#aaa; font-size:14.5px; margin:12px 0 15px;">${p.description.substring(0, 110)}...</p>
                    <div class="price">₹${p.price.toLocaleString('en-IN')}</div>
                    <button class="btn" onclick="window.open('${p.affiliate_link}', '_blank')">Buy on Amazon →</button>
                </div>
            </div>
        `;
    });
    document.getElementById("products").innerHTML = html || "<p style='text-align:center;'>No products found</p>";
}

function filterCategory(cat) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (cat === "All") renderProducts(PRODUCTS);
    else renderProducts(PRODUCTS.filter(p => p.category.toLowerCase().includes(cat.toLowerCase())));
}

document.getElementById("searchBar").addEventListener("input", (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = PRODUCTS.filter(p => p.title.toLowerCase().includes(term) || p.description.toLowerCase().includes(term));
    renderProducts(filtered);
});

window.onload = () => {
    loadProducts();
    // Blog Articles
    const blogHTML = `
        <div class="blog-card"><h3>Marshall Monitor III ANC Review</h3><p>70 Hours battery + Active Noise Cancellation</p><a href="#" style="color:var(--primary)">Read Full →</a></div>
        <div class="blog-card"><h3>Marshall Major V Review</h3><p>100+ Hours Battery King</p><a href="#" style="color:var(--primary)">Read Full →</a></div>
        <div class="blog-card"><h3>Logitech G915 vs Razer Huntsman</h3><p>Gaming Keyboard Comparison</p><a href="#" style="color:var(--primary)">Read Full →</a></div>
    `;
    document.getElementById("blog-grid").innerHTML = blogHTML;
};
</script>

</body>
</html>
