<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Best Budget Tech Gadgets | Handpicked & Honest Reviews"/>
    <title>TopTechPicks India • Premium Tech Gear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f5ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #1a0033);
            color: #fff;
            min-height: 100vh;
        }
        header {
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ffffff20;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #00f5ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero {
            text-align: center;
            padding: 100px 8% 60px;
        }
        .hero h1 {
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 16px;
        }
        .hero span { color: var(--primary); }
        .hero p {
            font-size: 22px;
            color: #aaa;
            max-width: 700px;
            margin: 0 auto;
        }

        .products {
            padding: 40px 8%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
        }
        .card {
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s;
            border: 1px solid #ffffff15;
        }
        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(0, 245, 255, 0.15);
        }
        .card img {
            width: 100%;
            height: 260px;
            object-fit: contain;
            background: #1a1a1a;
            padding: 20px;
        }
        .card-content {
            padding: 20px;
        }
        .price {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
        }
        .original {
            text-decoration: line-through;
            color: #666;
            font-size: 15px;
        }
        .btn {
            margin-top: 16px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00f5ff, #ff00ff);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            transform: scale(1.03);
        }
        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff00ff;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">TopTechPicks</div>
</header>

<section class="hero">
    <h1>Gear that <span>actually deserves</span> your desk.</h1>
    <p>Hand-picked headphones, keyboards & mice — Tested & Updated Daily</p>
</section>

<section class="products" id="products">
    <div style="text-align:center; grid-column:1/-1; padding:60px 20px; color:#888;">
        Loading premium picks...
    </div>
</section>

<script>
const SHEET_URL = "https://opensheet.elk.sh/11MjkRDuO7fDy4gWDQcRqWJZlEX3BJa2kXhwXoa97rCs/Sheet1";

async function loadProducts() {
    try {
        const res = await fetch(SHEET_URL);
        const data = await res.json();

        let html = "";
        data.forEach(p => {
            if (!p.title || p.title.trim() === "") return;

            const price = parseFloat(String(p.price || "0").replace(/[^0-9.]/g, "")) || 0;
            const original = Math.round(price * 1.35);

            html += `
                <div class="card">
                    <div style="position:relative">
                        <img src="${p.image}" alt="${p.title}" onerror="this.src='https://via.placeholder.com/400x300/1a1a1a/666?text=No+Image'">
                        <div class="badge">Best Pick</div>
                    </div>
                    <div class="card-content">
                        <h3 style="margin-bottom:10px; font-size:18px;">${p.title}</h3>
                        <p style="color:#aaa; font-size:14px; line-height:1.5; margin-bottom:15px;">
                            ${p.description ? p.description.substring(0, 110) + '...' : ''}
                        </p>
                        <div class="price">₹${price.toLocaleString('en-IN')}</div>
                        <div class="original">₹${original.toLocaleString('en-IN')}</div>
                        <button class="btn" onclick="window.open('${p.affiliate_link}', '_blank')">
                            Buy on Amazon →
                        </button>
                    </div>
                </div>
            `;
        });

        document.getElementById("products").innerHTML = html;
    } catch(e) {
        document.getElementById("products").innerHTML = `<div style="text-align:center; grid-column:1/-1; padding:60px; color:red;">Error loading products. Refresh karo.</div>`;
    }
}

window.onload = loadProducts;
</script>

</body>
</html>
