<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GearPick India</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #050505;
      color: white;
    }

    header {
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #00e5ff;
    }

    nav a {
      text-decoration: none;
      color: white;
      margin-left: 20px;
      transition: 0.3s;
      font-size: 15px;
    }

    nav a:hover {
      color: #00e5ff;
    }

    .hero {
      min-height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 8%;
      background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)),
        url('https://images.unsplash.com/photo-1542751110-97427bbecf20?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
    }

    .hero-content h1 {
      font-size: 60px;
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero-content h1 span {
      color: #00e5ff;
    }

    .hero-content p {
      color: #cfcfcf;
      max-width: 750px;
      margin: auto;
      line-height: 1.8;
      margin-bottom: 35px;
      font-size: 18px;
    }

    .hero-btn {
      display: inline-block;
      padding: 14px 34px;
      border-radius: 12px;
      background: #00e5ff;
      color: black;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
      box-shadow: 0 0 20px rgba(0,229,255,0.5);
    }

    .hero-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 35px rgba(0,229,255,0.8);
    }

    .section-title {
      text-align: center;
      font-size: 42px;
      margin-top: 80px;
      margin-bottom: 40px;
    }

    .section-title span {
      color: #00e5ff;
    }

    #products {
      width: 100%;
      padding: 20px 8% 100px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .product-card {
      background: #111;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.4s;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-10px);
      border-color: #00e5ff;
      box-shadow: 0 0 30px rgba(0,229,255,0.25);
    }

    .product-card img {
      width: 100%;
      height: 280px;
      object-fit: contain;
      background: #0a0a0a;
      padding: 20px;
    }

    .product-content {
      padding: 24px;
    }

    .product-content h2 {
      font-size: 22px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .product-content p {
      color: #c7c7c7;
      line-height: 1.7;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .price {
      font-size: 28px;
      color: #00e5ff;
      margin-bottom: 18px;
      font-weight: 700;
    }

    .buy-btn {
      width: 100%;
      display: inline-block;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      background: #00e5ff;
      color: black;
      font-weight: 700;
      text-decoration: none;
      transition: 0.3s;
    }

    .buy-btn:hover {
      background: white;
      transform: scale(1.02);
    }

    footer {
      padding: 35px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: #888;
    }

    .loader {
      text-align: center;
      padding: 60px;
      color: #00e5ff;
      font-size: 22px;
    }

    @media(max-width:768px) {
      .hero-content h1 {
        font-size: 38px;
      }

      nav {
        display: none;
      }

      .section-title {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">GearPick India</div>

    <nav>
      <a href="#home">Home</a>
      <a href="#products-section">Products</a>
      <a href="#footer">Contact</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <div class="hero-content">
      <h1>Best <span>Gaming Gear</span><br>For Pro Gamers</h1>

      <p>
        Discover premium gaming headphones, keyboards, gaming mice,
        accessories and top tech products with direct Amazon deals.
      </p>

      <a href="#products-section" class="hero-btn">Explore Products</a>
    </div>
  </section>

  <h2 class="section-title" id="products-section">
    Trending <span>Products</span>
  </h2>

  <div id="products">
    <div class="loader">Loading Products...</div>
  </div>

  <footer id="footer">
    © 2026 GearPick India • Amazon Affiliate Store
  </footer>

  <script>

    async function loadProducts() {

      const sheetURL = "https://opensheet.elk.sh/11MjkRDuO7fDy4gWDQcRqWJZlEX3BJa2kXhwXoa97rCs/sheet1";

      const response = await fetch(sheetURL);
      const products = await response.json();

      let html = "";

      products.forEach(product => {

        html += `

        <div class="product-card">

          <img src="${product.image}" alt="${product.title}">

          <div class="product-content">

            <h2>${product.title}</h2>

            <p>${product.description}</p>

            <div class="price">₹${product.price}</div>

            <a href="${product.affiliate_link}" target="_blank" class="buy-btn">
              Buy On Amazon
            </a>

          </div>

        </div>

        `;

      });

      document.getElementById("products").innerHTML = html;
    }

    loadProducts();

  </script>

</body>
</html>
