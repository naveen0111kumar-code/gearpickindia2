<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="GearPick India - Best Budget Gaming Gear, Headphones & Keyboards on Amazon"/>
    <title>GearPick India • Best Tech Picks 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00f5ff; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
        }
        header {
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(90deg, #00f5ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero {
            text-align: center;
            padding: 100px 8% 80px;
        }
        .hero h1 {
            font-size: 48px;
            line-height: 1.1;
            margin-bottom: 12px;
        }
        .hero p {
            font-size: 22px;
            color: #ccc;
            max-width: 700px;
            margin: 0 auto;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin: 40px 0;
            font-size: 18px;
        }
        .products {
            padding: 20px 8% 80px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
        }
        .card {
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s ease;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 50px rgba(0, 245, 255, 0.2);
        }
        .card img {
            width: 100%;
            height: 260px;
            object-fit: contain;
            background: #1a1a1a;
            padding: 20px;
        }
        .card-content {
            padding: 20px;
        }
        .category {
            font-size: 13px;
            background: rgba(0,245,255,0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .price {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
        }
        .original {
            text-decoration: line-through;
            color: #666;
            font-size: 15px;
        }
        .btn {
            margin-top: 16px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #00f5ff, #ff00ff);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            cursor: pointer;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<header>
    <div class="logo">GearPick India</div>
</header>

<section class="hero">
    <h1>Our Top Picks in <span>Tech & Gadgets</span></h1>
    <p>Handpicked • Tested • Honest Reviews • Best Amazon Deals India</p>
    
    <div class="stats">
        <div>10+ Products</div>
        <div>4 Categories</div>
        <div>₹5K+ Starting</div>
        <div>100% Verified</div>
    </div>
</section>

<section class="products" id="products">
    <div style="grid-column:1/-1; text-align:center; padding:80px 20px; color:#888;">
        Loading Premium Picks...
    </div>
</section>

<script>
const SHEET_URL = "https://opensheet.elk.sh/11MjkRDuO7fDy4gWDQcRqWJZlEX3BJa2kXhwXoa97rCs/Sheet1";

async function loadProducts() {
    try {
        const res = await fetch(SHEET_URL);
        const data = await res.json();

        let html = "";
        data.forEach(p => {
            if (!p.title || p.title.trim() === "") return;
            
            const price = parseFloat(String(p.price || "0").replace(/[^0-9.]/g, "")) || 0;
            const original = Math.round(price * 1.35);

            html += `
                <div class="card">
                    <img src="${p.image}" alt="${p.title}" 
                         onerror="this.src='https://via.placeholder.com/400x300/1a1a1a/666?text=No+Image'">
                    <div class="card-content">
                        <div class="category">HEADPHONES / KEYBOARD</div>
                        <h3>${p.title}</h3>
                        <p style="color:#aaa; font-size:14.5px; margin:12px 0;">
                            ${p.description ? p.description.substring(0, 130) + '...' : 'Premium quality gear'}
                        </p>
                        <div class="price">₹${price.toLocaleString('en-IN')}</div>
                        <div class="original">₹${original.toLocaleString('en-IN')}</div>
                        <button class="btn" onclick="window.open('${p.affiliate_link}', '_blank')">
                            Buy on Amazon →
                        </button>
                    </div>
                </div>
            `;
        });

        document.getElementById("products").innerHTML = html || "<p>No products found</p>";
    } catch(e) {
        document.getElementById("products").innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px; color:red;">Error loading products. Refresh karo.</div>`;
    }
}

window.onload = loadProducts;
</script>

</body>
</html>
