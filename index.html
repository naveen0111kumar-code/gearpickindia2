<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GearPick India</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Poppins;background:#050505;color:#fff}
.products-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:20px}

.card{background:#111;border:1px solid #222;border-radius:15px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:contain;background:#fff}

.content{padding:15px}
.price{color:#00d9ff;font-size:20px;font-weight:700}
.btn{display:block;margin-top:10px;padding:10px;background:#00d9ff;color:#000;text-align:center;text-decoration:none;font-weight:700;border-radius:8px}
.empty{text-align:center;padding:40px;color:#888}
</style>
</head>

<body>

<h2 style="text-align:center;padding:20px">🛒 GearPick Products</h2>

<div class="products-grid" id="products">
  <div class="empty">Loading...</div>
</div>

<script>

const SHEET_URL = "https://opensheet.elk.sh/11MjkRDuO7fDy4gWDQcRqWJZlEX3BJa2kXhwXoa97rCs/sheet1";

let PRODUCTS = [];

/* 🔥 FIXED AUTO LOAD */
async function loadProducts(){
  try {
    const res = await fetch(SHEET_URL);
    const data = await res.json();

    if(!data || !Array.isArray(data) || data.length === 0){
      document.getElementById("products").innerHTML =
        "<div class='empty'>No products found</div>";
      return;
    }

    PRODUCTS = data.map(p => {

      // 🔥 SAFE PRICE FIX (MAIN ISSUE FIXED)
      let cleanPrice = String(p.price || "0")
        .replace(/[^0-9.]/g, "");

      return {
        title: p.title || "No Title",
        description: p.description || "",
        image: p.image || "https://via.placeholder.com/300",
        price: parseFloat(cleanPrice) || 0,
        affiliate_link: p.affiliate_link || "#"
      };
    });

    render(PRODUCTS);

  } catch (err) {
    console.log(err);
    document.getElementById("products").innerHTML =
      "<div class='empty'>⚠️ Failed to load sheet</div>";
  }
}

/* 🔥 SAFE RENDER */
function render(list){
  let html = "";

  list.forEach(p => {

    const price = p.price;
    const original = price ? Math.round(price * 1.3) : 0;
    const save = price ? original - price : 0;

    html += `
      <div class="card">
        <img src="${p.image}" loading="lazy">

        <div class="content">
          <h3>${p.title}</h3>
          <p>${p.description}</p>

          <div class="price">₹${price}</div>
          <small>Save ₹${save}</small>

          <a class="btn" href="${p.affiliate_link}" target="_blank">
            🛒 Buy on Amazon
          </a>
        </div>
      </div>
    `;
  });

  document.getElementById("products").innerHTML = html;
}

/* INIT */
window.addEventListener("DOMContentLoaded", loadProducts);

</script>

</body>
</html>
