        .card:hover { transform: translateY(-6px); transition: all .25s ease; border-color: rgba(0,245,255,.38); }
        .card img { width:100%; height:220px; object-fit:contain; background:#0b0e1a; padding:16px; }

        .pin-btn { padding: 11px 12px; background:#e60023; color:#fff; border-radius:10px; text-decoration:none; font-size:.82rem; font-weight:700; }

        .sticky-cta { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); width:min(94%, 460px); background:rgba(9,11,20,.96); border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:10px; display:flex; gap:8px; z-index:20; }

<body>
<header><div class="logo">GearPick India</div></header>

<section class="hero">
    <h1>Top Tech Picks for Smart Buyers</h1>
    <p>Fast, mobile-friendly product discovery with honest affiliate recommendations for headphones, keyboards and mice.</p>
</section>

<div class="controls">
    <input type="text" id="searchBar" class="search-bar" placeholder="Search headphones, keyboard, mouse..." aria-label="Search products">
    <button class="filter-btn active" onclick="filterCategory('All', this)">All</button>
    <button class="filter-btn" onclick="filterCategory('Headphones', this)">Headphones</button>
    <button class="filter-btn" onclick="filterCategory('Keyboard', this)">Keyboard</button>
    <button class="filter-btn" onclick="filterCategory('Mouse', this)">Mouse</button>
</div>

<section class="products" id="products" aria-live="polite"></section>

<div class="sticky-cta">
    <a id="stickyBuy" class="sticky-main" href="https://naveen0111kumar-code.github.io/gearpickindia2/top-picks.html" target="_blank" rel="noopener">🔥 View Top Picks</a>
    <a id="stickyPin" class="sticky-pin" href="#" target="_blank" rel="noopener">📌 Share</a>
</div>

<section class="blog">
    <h2>Latest Reviews & Buying Guides</h2>
    <div class="blog-grid" id="blog-grid"></div>
</section>

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"WebSite",
  "name":"GearPick India",
  "url":"https://naveen0111kumar-code.github.io/gearpickindia2/",
  "potentialAction": {
    "@type":"SearchAction",
    "target":"https://naveen0111kumar-code.github.io/gearpickindia2/?q={search_term_string}",
    "query-input":"required name=search_term_string"
  }
}
</script>

<script>
const SHEET_URL = "https://opensheet.elk.sh/11MjkRDuO7fDy4gWDQcRqWJZlEX3BJa2kXhwXoa97rCs/Sheet1";
let PRODUCTS = [];

function pinterestShareUrl(title, image, link) {
  const u = new URL('https://www.pinterest.com/pin/create/button/');
  u.searchParams.set('url', link || window.location.href);
  u.searchParams.set('media', image || '');
  u.searchParams.set('description', title || 'GearPick India Top Picks');
  return u.toString();
}

async function loadProducts() {
  try {
    const res = await fetch(SHEET_URL, { cache: 'force-cache' });
    const data = await res.json();

    PRODUCTS = data.map(p => ({
      title: (p.title || "").trim(),
      description: (p.description || "").trim(),
      image: (p.image || "").trim(),
      price: parseFloat(String(p.price || "0").replace(/[^0-9.]/g, "")) || 0,
      affiliate_link: p.affiliate_link || "#",
      category: (p.category || "Other").trim()
    })).filter(p => p.title.length > 5);

    renderProducts(PRODUCTS);
    updateStickyCTA(PRODUCTS[0]);
  } catch(e) {
    document.getElementById("products").innerHTML = `<div style="text-align:center; color:#ff8b8b;">Products load nahi ho rahe. Refresh karo.</div>`;
  }
}

function updateStickyCTA(product) {
  if (!product) return;
  const stickyBuy = document.getElementById('stickyBuy');
  const stickyPin = document.getElementById('stickyPin');
  stickyBuy.href = product.affiliate_link || stickyBuy.href;
  stickyBuy.textContent = `🛒 Buy: ${product.title.substring(0, 22)}...`;
  stickyPin.href = pinterestShareUrl(product.title, product.image, product.affiliate_link);
}

function renderProducts(list) {
  let html = "";
  list.forEach((p, i) => {
    html += `
      <article class="card">
        <img src="${p.image}" alt="${p.title}" loading="lazy" decoding="async" onerror="this.src='https://via.placeholder.com/400x300/1a1a1a/666?text=No+Image'">
        <div class="card-content">
          <small class="chip">${p.category}</small>
          <h3 class="title">${p.title}</h3>
          <p class="desc">${p.description.substring(0, 110)}...</p>
          <div class="price-row">
            <div class="price">₹${p.price.toLocaleString('en-IN')}</div>
            <div class="card-actions">
              <a class="pin-btn" href="${pinterestShareUrl(p.title, p.image, p.affiliate_link)}" target="_blank" rel="noopener noreferrer">Pinterest</a>
              <a class="btn" href="${p.affiliate_link}" target="_blank" rel="nofollow noopener" onclick="updateStickyCTA(PRODUCTS[${i}])">Buy</a>
            </div>
          </div>
        </div>
      </article>`;
  });
  document.getElementById("products").innerHTML = html || "<p style='text-align:center;'>No products found</p>";
}

function filterCategory(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (cat === "All") renderProducts(PRODUCTS);
  else renderProducts(PRODUCTS.filter(p => p.category.toLowerCase().includes(cat.toLowerCase())));
}

document.getElementById("searchBar").addEventListener("input", (e) => {
  const term = e.target.value.toLowerCase();
  const filtered = PRODUCTS.filter(p => p.title.toLowerCase().includes(term) || p.description.toLowerCase().includes(term));
  renderProducts(filtered);
});

window.onload = () => {
  loadProducts();
  document.getElementById('stickyPin').href = pinterestShareUrl('GearPick India Top Picks', '', window.location.href);
  document.getElementById("blog-grid").innerHTML = `
    <div class="blog-card"><h3>Marshall Monitor III ANC Review</h3><p>70 Hours battery + Active Noise Cancellation</p></div>
    <div class="blog-card"><h3>Marshall Major V Review</h3><p>100+ Hours Battery King</p></div>
    <div class="blog-card"><h3>Logitech G915 vs Razer Huntsman</h3><p>Gaming Keyboard Comparison</p></div>`;
};
</script>
</body>
