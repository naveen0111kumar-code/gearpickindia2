<script>

// ==========================
// 🔥 CLICK TRACKING (ADD ON TOP SAFE)
// ==========================
function trackClick(productName, link){
  let clicks = JSON.parse(localStorage.getItem("clicks") || "[]");

  clicks.push({
    product: productName,
    link: link,
    time: new Date().toISOString()
  });

  localStorage.setItem("clicks", JSON.stringify(clicks));
}


// ==========================
// 📊 ADMIN PANEL (AUTO)
// ==========================
function showStats(){
  let clicks = JSON.parse(localStorage.getItem("clicks") || "[]");

  let el = document.getElementById("clickStats");
  if(el){
    el.innerText = "Total Clicks: " + clicks.length;
  }
}

function clearStats(){
  localStorage.removeItem("clicks");
  showStats();
}

setInterval(showStats, 2000);


// ==========================
// 🔓 F9 PANEL TOGGLE
// ==========================
document.addEventListener("keydown", function(e){
  if(e.key === "F9"){
    const panel = document.getElementById("adminPanel");
    if(panel){
      panel.style.display = (panel.style.display === "block") ? "none" : "block";
    }
  }
});


// ==========================
// 🛒 FIXED GOOGLE SHEET LOAD (YOUR SAME SYSTEM)
// ==========================
async function loadProducts(){

  const sheetURL = "https://opensheet.elk.sh/11MjkRDuO7fDy4gWDQcRqWJZlEX3BJa2kXhwXoa97rCs/sheet1";

  try {

    const res = await fetch(sheetURL);
    if(!res.ok) throw new Error("Sheet error");

    const products = await res.json();

    const box = document.getElementById("products");
    box.innerHTML = "";

    let html = "";

    products.forEach((p,i)=>{

      let cat = "gadgets";
      const t = (p.title || "").toLowerCase();

      if(t.includes("headphone")) cat="headphone";
      else if(t.includes("keyboard")) cat="keyboard";
      else if(t.includes("mouse") || t.includes("cable") || t.includes("adapter")) cat="accessories";

      const price = Number(p.price || 0);
      const original = Math.round(price * 1.3);
      const save = original - price;

      html += `
        <div class="product-card" data-category="${cat}">

          <div class="product-image">
            <img src="${p.image}" alt="${p.title}">
          </div>

          <div class="product-content">
            <h2>${p.title}</h2>
            <p>${p.description || ""}</p>

            <div class="price">₹${price}</div>
            <div class="price-original">₹${original}</div>
            <div class="savings">Save ₹${save}</div>

            <a href="${p.affiliate_link}" target="_blank"
               rel="noopener sponsored"
               onclick="trackClick('${p.title}','${p.affiliate_link}')"
               class="buy-btn">
               🛒 Buy on Amazon
            </a>

          </div>
        </div>
      `;
    });

    box.innerHTML = html;

    setupSearch();
    setupFilter();

  } catch(e){
    document.getElementById("products").innerHTML =
      "<p style='color:red'>Failed to load products</p>";
  }
}

loadProducts();


// ==========================
// 🔍 SEARCH + FILTER (FIXED MERGED)
// ==========================
function applyFilters(){

  const search = document.getElementById("searchInput")?.value.toLowerCase() || "";
  const cat = document.getElementById("categoryFilter")?.value || "all";

  document.querySelectorAll(".product-card").forEach(card=>{

    const text = card.innerText.toLowerCase();

    const ok1 = text.includes(search);
    const ok2 = cat === "all" || card.dataset.category === cat;

    card.style.display = (ok1 && ok2) ? "block" : "none";
  });
}

function setupSearch(){
  document.getElementById("searchInput")?.addEventListener("keyup", applyFilters);
}

function setupFilter(){
  document.getElementById("categoryFilter")?.addEventListener("change", applyFilters);
}


// ==========================
// ⏱ COUNTDOWN (SAFE)
// ==========================
setInterval(()=>{

  const now = new Date();
  const end = new Date();
  end.setHours(23,59,59,0);

  const diff = end - now;

  const h = Math.floor(diff/3600000);
  const m = Math.floor(diff%3600000/60000);
  const s = Math.floor(diff%60000/1000);

  if(document.getElementById("h")) document.getElementById("h").innerText = String(h).padStart(2,"0");
  if(document.getElementById("m")) document.getElementById("m").innerText = String(m).padStart(2,"0");
  if(document.getElementById("s")) document.getElementById("s").innerText = String(s).padStart(2,"0");

},1000);

</script>
